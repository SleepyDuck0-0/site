<!DOCTYPE HTML>
<html>
<head>
	<title>No Sidebar - Strongly Typed by HTML5 UP</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<link rel="stylesheet" href="assets/css/main.css" />
	<style>
		/* Pagination buttons */
		.pagination {
			display: flex;
			justify-content: center;
			margin: 20px 0;
			gap: 5px;
		}

		.pagination button {
			padding: 5px 10px;
			border: 1px solid #333;
			background: #ed786a;
			cursor: pointer;
			border-radius: 5px;
			transition: background 0.3s;
		}

		.pagination button:hover {
			background: #d06a5f;
		}

		.pagination button.active {
			background: #000000;
			color: #ffffff;
		}

		/* Hide default gallery overflow during JS render */
		.gallery img {
			max-width: 100%;
			height: auto;
			border-radius: 5px;
			transition: transform 0.3s ease;
			cursor: pointer;
		}

		.gallery img:hover {
			transform: scale(1.05);
		}

		.gallery .title {
			text-align: center;
			margin-top: 5px;
			font-weight: bold;
		}

		.modal {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.8);
			display: none;
			align-items: center;
			justify-content: center;
			z-index: 1000;
		}

		.modal:target {
			display: flex;
		}

		.modal-content {
			position: relative;
			max-width: 90%;
			max-height: 90%;
			background: #fff;
			padding: 20px;
			border-radius: 8px;
			text-align: center;
			overflow: auto;
		}

		.modal-content img {
			max-width: 100%;
			max-height: 70vh;
			border-radius: 5px;
		}

		.modal-close {
			position: absolute;
			top: 10px;
			right: 15px;
			font-size: 28px;
			text-decoration: none;
			color: #333;
			font-weight: bold;
		}
	</style>
</head>
<body class="no-sidebar is-preload">
<div id="page-wrapper">


	<!-- Main -->
	<section id="main">
		<div class="container">
			<!-- Dynamic Gallery -->
			<div class="gallery" id="gallery"></div>

			<!-- Pagination -->
			<div class="pagination" id="pagination"></div>

			<!-- Dynamic Modals -->
			<div id="modals"></div>

			<!-- Lightbox overlay -->
			<div id="lightbox" class="lightbox">
				<img id="lightbox-img" src="" alt="Full Size Image">
				<button class="close-btn" onclick="closeLightbox()">×</button>
			</div>
		</div>
	</section>


</div>

<!-- Scripts -->
<script src="assets/js/jquery.min.js"></script>
<script src="assets/js/jquery.dropotron.min.js"></script>
<script src="assets/js/browser.min.js"></script>
<script src="assets/js/breakpoints.min.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/main.js"></script>

<script>
	// ======= EDITABLE AREA =======
	const images = [
		{src: "images/Photos/2024-08-25, New York - Statue of Liberty (2).JPG", title: "Photo 1"},
		{src: "images/Photos/2024-08-25, New York - Statue of Liberty (2).JPG", title: "Photo 2"},
		{src: "images/Photos/2024-08-25, New York - Statue of Liberty (2).JPG", title: "Photo 3"},
		{src: "{{ site.url }}{{ site.baseurl }}/images/pic04.jpg", title: "Photo 4"},
		{src: "{{ site.url }}{{ site.baseurl }}/images/pic05.jpg", title: "Photo 5"},
		{src: "{{ site.url }}{{ site.baseurl }}/images/pic06.jpg", title: "Photo 6"},
		{src: "{{ site.url }}{{ site.baseurl }}/images/pic07.jpg", title: "Photo 7"},
		{src: "{{ site.url }}{{ site.baseurl }}/images/pic01.jpg", title: "Photo 8"},
		{src: "{{ site.url }}{{ site.baseurl }}/images/pic02.jpg", title: "Photo 9"}
	];
	const imagesPerPage = 3;
	// ======= END EDITABLE AREA =======

	const gallery = document.getElementById('gallery');
	const pagination = document.getElementById('pagination');
	const modalsContainer = document.getElementById('modals');
	let currentPage = 1;
	const totalPages = Math.ceil(images.length / imagesPerPage);

	function renderGallery(page) {
		gallery.innerHTML = "";
		modalsContainer.innerHTML = "";

		const start = (page - 1) * imagesPerPage;
		const end = Math.min(start + imagesPerPage, images.length);
		const pageImages = images.slice(start, end);

		pageImages.forEach((img, idx) => {
			const modalId = `modal${start + idx + 1}`;
			const a = document.createElement('a');
			a.href = `#${modalId}`;
			a.className = 'gallery-item';
			a.innerHTML = `<img src="${img.src}" alt="${img.title}"><div class="title">${img.title}</div>`;
			gallery.appendChild(a);

			const modal = document.createElement('div');
			modal.id = modalId;
			modal.className = 'modal';
			modal.innerHTML = `
				<div class="modal-content">
					<a href="#" class="modal-close">&times;</a>
					<img src="${img.src}" alt="${img.title}">
					<h2>${img.title}</h2>
				</div>
			`;
			modalsContainer.appendChild(modal);
		});

		renderPagination();
	}

	function renderPagination() {
		pagination.innerHTML = "";

		if (currentPage > 1) {
			const prevBtn = document.createElement('button');
			prevBtn.textContent = "« Prev";
			prevBtn.addEventListener('click', () => {
				currentPage--;
				renderGallery(currentPage);
			});
			pagination.appendChild(prevBtn);
		}

		for (let i = 1; i <= totalPages; i++) {
			const btn = document.createElement('button');
			btn.textContent = i;
			if (i === currentPage) btn.classList.add('active');
			btn.addEventListener('click', () => {
				currentPage = i;
				renderGallery(currentPage);
			});
			pagination.appendChild(btn);
		}

		if (currentPage < totalPages) {
			const nextBtn = document.createElement('button');
			nextBtn.textContent = "Next »";
			nextBtn.addEventListener('click', () => {
				currentPage++;
				renderGallery(currentPage);
			});
			pagination.appendChild(nextBtn);
		}
	}

	renderGallery(currentPage);

	function openLightbox(img) {
		document.getElementById('lightbox-img').src = img.src;
		document.getElementById('lightbox').style.display = 'flex';
	}

	function closeLightbox() {
		document.getElementById('lightbox').style.display = 'none';
	}
</script>

</body>
</html>
