---
layout: default
---

<!-- Main -->
	<section id="main">
		<div class="container">
			<div class="row">

				<!-- Sidebar -->
					<aside id="sidebar" class="col-3 col-12-medium">

						{%for post in site.posts %}
						<article class="box excerpt">
							<header>
								<h4><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h4>
								<time datetime = "{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: '%B %Y' }} </time>
								<!-- <p><a href="{{ post.title }}"></a></p> -->
							</header>
						</article>
						{% endfor %}
					</aside>

				<!-- Content -->
					<div id="content" class="col-9 col-12-medium imp-medium">

						<!-- Post -->
							<article class="box post">
								<header>
									<h2>{{ page.title }}</h2>
                                    <h3><time datetime = "{{ page.date | date: '%B %d, %Y' }}">
									{{ page.date | date: '%B %Y' }}
									</time></h3>

							
								</header>
                                {% if page.image %}
								<span class="image featured" style=" max-height: 50%; max-width: 100%; height: auto; width: auto;"><img src="{{ page.image | relative_url }}" alt="{{ page.title }}"></span>
                                {% endif %}

                                {{ content }}

							</article>

					</div>
			</div>
		</div>
	</section>
